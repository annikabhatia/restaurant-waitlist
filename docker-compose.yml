services:
  postgres:
    image: postgres:16
    container_name: postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: waitlist
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=admin
      - DB_PASSWORD=password
      - DB_NAME=waitlist
    depends_on:
      - postgres
    volumes:
      - ./backend:/app
      - /app/node_modules

  customer-app:
    build: ./customer-app
    container_name: customer-app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./customer-app:/app
      - /app/node_modules

  staff-app:
    build: ./staff-app
    container_name: staff-app
    ports:
      - "5174:5174"
    environment:
      - VITE_API_URL=http://localhost:3000
    depends_on:
      - backend
    volumes:
      - ./staff-app:/app
      - /app/node_modules

volumes:
  postgres-data: