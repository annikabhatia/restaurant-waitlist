version: "3.8"
services:
  postgres:
    image: postgres:16
    container_name: postgres-local
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: waitlist
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: